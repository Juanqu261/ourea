name: Deploy Ourea demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ourea-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build with GitHub Pages base path
        working-directory: frontend
        env:
          OUREA_BASE: /ourea/
          VITE_OUREA_AI_API_URL: ${{ vars.OUREA_AI_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://ybedoyab.github.io/ourea/
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OUREA_DEMO_URL: https://ybedoyab.github.io/ourea/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wait for GitHub Pages to serve the demo
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          urls = [
              "https://ybedoyab.github.io/ourea/",
              "https://ybedoyab.github.io/ourea/data/climate_context.json",
              "https://ybedoyab.github.io/ourea/data/medellin_city_priority_screen.geojson",
          ]
          last_error = None
          for attempt in range(1, 19):
              try:
                  for url in urls:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          if response.status >= 400:
                              raise RuntimeError(f"{url} -> {response.status}")
                  print("GitHub Pages is serving /ourea/")
                  sys.exit(0)
              except (urllib.error.URLError, RuntimeError, TimeoutError) as error:
                  last_error = error
                  print(f"attempt {attempt}: {error}")
                  time.sleep(10)
          print(f"Pages did not become ready: {last_error}")
          sys.exit(1)
          PY
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Published demo smoke
        working-directory: frontend
        run: npx playwright test --grep "published demo"
      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-published-demo
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
