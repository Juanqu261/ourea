name: Ourea CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ourea-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          activate-environment: true
          no-project: true
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - id: js
        name: JavaScript tests and data validation
        working-directory: frontend
        run: npm test

      - id: manifest
        name: Manifest and checksums
        run: uv run python scripts/make_manifest.py --check

      - id: build
        name: Production build
        working-directory: frontend
        run: npm run build

      - id: chunk
        name: Confirm MapLibre remains a deferred chunk
        working-directory: frontend
        run: node -e "const fs=require('fs'); const files=fs.readdirSync('dist/assets'); if(!files.some(f=>f.startsWith('maplibre-')&&f.endsWith('.js'))) throw new Error('MapLibre chunk missing'); const app=files.filter(f=>f.endsWith('.js')&&!f.startsWith('maplibre-')); const initial=app.map(f=>'dist/assets/'+f).map(p=>fs.statSync(p).size); if(Math.max(...initial)>500000) throw new Error('Initial JS exceeded 500 kB'); console.log(files.join('\n'));"

      - name: Install Python QA dependencies
        run: uv pip install -r requirements.txt -r requirements-ai.txt

      - id: python
        name: Python syntax, unit tests, AI service and audit, CORNARE inputs, and decision engine outputs
        run: |
          uv run python -m compileall -q scripts tests decision_engine services
          uv run python -m unittest discover -s tests -p "test_*.py" -v
          node tests/js/audit_bundle.mjs > "$RUNNER_TEMP/audit_bundle.json"
          uv run python -m services.decision_ai.audit "$RUNNER_TEMP/audit_bundle.json"
          uv run python scripts/climaterisk/validate_inputs.py
          uv run python -m decision_engine.build --check

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - id: pagesbase
        name: GitHub Pages base path
        working-directory: frontend
        env:
          OUREA_BASE: /ourea/
          OUREA_PAGES_BROWSER: '1'
        run: |
          npm run build
          node tests/verifyPagesDist.mjs

      - id: e2e
        name: End-to-end
        working-directory: frontend
        run: npx playwright test

      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: QA summary
        if: always()
        run: |
          {
            echo "## Ourea QA"
            echo "- JS tests: ${{ steps.js.outcome }}"
            echo "- Manifest: ${{ steps.manifest.outcome }}"
            echo "- Production build: ${{ steps.build.outcome }}"
            echo "- Python tests: ${{ steps.python.outcome }}"
            echo "- Pages base: ${{ steps.pagesbase.outcome }}"
            echo "- E2E: ${{ steps.e2e.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-pages:
    needs: qa
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Require GitHub Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository. Open Settings → Pages → Build and deployment → Source → GitHub Actions once. This workflow cannot enable Pages with GITHUB_TOKEN."
          exit 1
      - name: Build with the Pages base path
        working-directory: frontend
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PAGES_BASE_PATH}"
          if [ -z "$base" ]; then
            base="/"
          else
            case "$base" in
              */) ;;
              *) base="${base}/" ;;
            esac
          fi
          echo "Using Vite base ${base}"
          export OUREA_BASE="${base}"
          npm ci
          npm run build
          node tests/verifyPagesDist.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wait for the deployed site
        env:
          OUREA_DEMO_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          demo = os.environ.get("OUREA_DEMO_URL", "").strip()
          if not demo:
              print("deploy-pages did not return page_url")
              sys.exit(1)
          base = demo.rstrip("/") + "/"
          urls = [
              base,
              base + "data/cornare/interventions.json",
              base + "data/cornare/municipalities.geojson",
          ]
          print("Checking", base)
          last_error = None
          for attempt in range(1, 19):
              try:
                  for url in urls:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          if response.status >= 400:
                              raise RuntimeError(f"{url} -> {response.status}")
                  print("Published site is serving", base)
                  sys.exit(0)
              except (urllib.error.URLError, RuntimeError, TimeoutError) as error:
                  last_error = error
                  print(f"attempt {attempt}: {error}")
                  time.sleep(10)
          print(f"Published site did not become ready: {last_error}")
          sys.exit(1)
          PY
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Published demo smoke
        working-directory: frontend
        env:
          OUREA_DEMO_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: npx playwright test --grep "published demo"
      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-published-demo
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Deployment summary
        if: always()
        env:
          OUREA_DEMO_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          {
            echo "## Ourea deployment"
            echo "- QA: passed"
            echo "- Pages build: passed"
            echo "- Deployment URL: ${OUREA_DEMO_URL}"
            echo "- Published smoke: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
